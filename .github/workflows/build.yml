name: Build OCT Analyzer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15        # Apple Silicon (ARM64)
          - macos-15-intel  # Intel (x86_64)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup MATLAB & Toolboxes
        uses: matlab-actions/setup-matlab@v3
        with:
          cache: true
          products: >
            MATLAB
            MATLAB_Compiler
            Deep_Learning_Toolbox
            Image_Processing_Toolbox
        env:
          MATHWORKS_TOKEN: ${{ secrets.MATHWORKS_TOKEN }}
          MLM_LICENSE_FILE: ${{ secrets.MLM_LICENSE_FILE }}
        
      - name: Compile App
        uses: matlab-actions/run-command@v3
        with:
          command: compile_oct_app_installer
        env:
          MATHWORKS_TOKEN: ${{ secrets.MATHWORKS_TOKEN }}
          MLM_LICENSE_FILE: ${{ secrets.MLM_LICENSE_FILE }}
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OCTAnalyzer-${{ matrix.os }}
          path: OCTAnalyzer_installer/installer/
